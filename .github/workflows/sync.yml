name: sync-preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy built site without CNAME
        run: |
          git clone --depth 1 https://github.com/mrblack1971-dot/georgelatta-site site
          cd site
          rm -rf .git CNAME _b64 .github
          touch .nojekyll
          git init -q -b staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview snapshot of georgelatta-site"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" staging
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" staging:gh-pages || true
